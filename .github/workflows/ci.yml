name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketplace.json
        run: |
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"
          echo "✅ .claude-plugin/marketplace.json is valid JSON"
          python3 -c "import json; json.load(open('.wanma-cli-plugin/marketplace.json'))"
          echo "✅ .wanma-cli-plugin/marketplace.json is valid JSON"
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          echo "✅ .claude-plugin/plugin.json is valid JSON"
          python3 -c "import json; json.load(open('.wanma-cli-plugin/plugin.json'))"
          echo "✅ .wanma-cli-plugin/plugin.json is valid JSON"

      - name: Validate Skills Structure
        run: |
          python3 << 'EOF'
          import json
          import os
          import re

          errors = []
          warnings = []

          with open('.claude-plugin/marketplace.json') as f:
              data = json.load(f)

          # Validate marketplace.json structure
          if 'name' not in data:
              errors.append("marketplace.json: missing 'name'")
          if 'plugins' not in data:
              errors.append("marketplace.json: missing 'plugins'")

          # Validate each plugin
          for plugin in data.get('plugins', []):
              if 'name' not in plugin:
                  errors.append("Plugin missing 'name'")

          # Auto-discover and validate skills from skills/ directory
          skills_dir = 'skills'
          if not os.path.isdir(skills_dir):
              errors.append("skills/ directory not found")
          else:
              for skill_name in sorted(os.listdir(skills_dir)):
                  skill_path = os.path.join(skills_dir, skill_name)
                  if not os.path.isdir(skill_path):
                      continue

                  skill_md = os.path.join(skill_path, 'SKILL.md')
                  if not os.path.exists(skill_md):
                      errors.append(f"Missing SKILL.md: {skill_md}")
                      continue

                  with open(skill_md) as f:
                      content = f.read()

                  if not content.startswith('---'):
                      errors.append(f"{skill_md}: missing frontmatter")
                      continue

                  match = re.match(r'^---\s*\n(.*?)\n---\s*\n', content, re.DOTALL)
                  if not match:
                      errors.append(f"{skill_md}: invalid frontmatter format")
                      continue

                  try:
                      import yaml
                      frontmatter = yaml.safe_load(match.group(1))
                  except:
                      if 'name:' not in content.split('---')[1]:
                          errors.append(f"{skill_md}: missing 'name' in frontmatter")
                      if 'description:' not in content.split('---')[1]:
                          errors.append(f"{skill_md}: missing 'description' in frontmatter")
                      continue

                  if not frontmatter.get('name'):
                      errors.append(f"{skill_md}: empty or missing 'name'")
                  if not frontmatter.get('description'):
                      errors.append(f"{skill_md}: empty or missing 'description'")

          # Print results
          if warnings:
              print("\n⚠️  Warnings:")
              for w in warnings:
                  print(f"  - {w}")

          if errors:
              print("\n❌ Errors:")
              for e in errors:
                  print(f"  - {e}")
              exit(1)

          print("\n✅ All validations passed!")
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lint Python Scripts
        run: |
          pip install flake8
          find skills -name "*.py" -exec flake8 {} \; || true
          echo "✅ Python linting completed"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Documentation
        run: |
          # Check that README exists and has required sections
          if [ ! -f README.md ]; then
            echo "❌ README.md is missing"
            exit 1
          fi

          required_sections=("Installation" "Usage" "License")
          for section in "${required_sections[@]}"; do
            if ! grep -q "$section" README.md; then
              echo "⚠️  README.md might be missing '$section' section"
            fi
          done

          # Check that CHANGELOG exists
          if [ ! -f CHANGELOG.md ]; then
            echo "⚠️  CHANGELOG.md is missing"
          fi

          # Check that LICENSE exists
          if [ ! -f LICENSE ]; then
            echo "❌ LICENSE is missing"
            exit 1
          fi

          echo "✅ Documentation check completed"
